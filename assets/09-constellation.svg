<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="505" viewBox="0 0 1200 505" role="img" aria-label="Skill constellation: Luma (PyTorch, knowledge distillation, calibration, ONNX Runtime, FastAPI, Next.js, AES-GCM and RBAC); QoS Buddy (contextual bandits, RAG, Ollama, Redis Streams, Keycloak, MLflow, OpenTelemetry); SUP'COM research (CNN, ensembles, OWASP Top 10); freelance (forecasting, churn models, Power BI); Python at the centre."><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0a1f"/><stop offset="1" stop-color="#1a1240"/></linearGradient>
