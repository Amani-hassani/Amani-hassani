<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Stop 04. The road here: 2019 BSc computer science; 2021 to 2023 freelance data science; 2022 research master's with ML firewall research at SUP'COM; 2023 to 2025 teaching assistant at ESPRIT; 2026 QoS Buddy first prize and Luma at ESPRIT-Tech; 2027 your team?"><defs>
