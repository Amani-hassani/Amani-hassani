00 H600" stroke="#27365a" stroke-width="3"/><path d="M84 300 H600" stroke="#9fb8d6" stroke-width="2" class="flow"/><circle cx="84" cy="300" r="6" fill="#17233d" stroke="#9fb8d6" stroke-width="2"/><text x="84.0" y="330" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a9b3c7" >monitor</text><circle cx="170" cy="300" r="6" fill="#17233d" stroke="#9fb8d6" stroke-width="2"/><text x="170.0" y="330" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a9b3c7" >detect</text><circle cx="256" cy="300" r="6" fill="#17233d" stroke="#9fb8d6" stroke-width="2"/><text x="256.0" y="330" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a9b3c7" >predict</text><circle cx="342" cy="300" r="6" fill="#17233d" stroke="#9fb8d6" stroke-width="2"/><text x="342.0" y="330" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a9b3c7" >diagnose</text><circle cx="428" cy="300" r="9" fill="#17233d" stroke="#e8b4a0" stroke-width="3"/><text x="428.0" y="330" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f3eee6" >optimise</text><circle cx="514" cy="300" r="9" fill="#17233d" stroke="#e8b4a0" stroke-width="3"/><text x="514.0" y="330" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f3eee6" >approve</text><circle cx="600" cy="300" r="6" fill="#17233d" stroke="#9fb8d6" stroke-width="2"/><text x="600.0" y="330" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a9b3c7" >report</text><path d="M414 278 H528" stroke="#e8b4a0" stroke-width="2" stroke-linecap="round"/><g transform="rotate(-3 471.0 266)"><text x="471.0" y="266" text-anchor="middle" font-family="'Ink Free', 'Segoe Script', 'Bradley Hand', 'Marker Felt', 'Comic Neue', cursive" font-size="19" font-weight="400" fill="#e8b4a0" >I designed these two</text></g><circle r="5" fill="#e3cf9f"><animateMotion dur="6s" repeatCount="indefinite" path="M84 300 H600"/></circle><path d="M78 338 Q 80 346 98 346 H328 Q 342 346 342 356 Q 342 346 356 346 H586 Q 604 346 606 338" fill="none" stroke="#a9c8b4" stroke-width="2" stroke-linecap="round"/><g transform="rotate(-2 342.0 382)"><text x="342.0" y="382" text-anchor="middle" font-family="'Ink Free', 'Segoe Script', 'Bradley Hand', 'Marker Felt', 'Comic Neue', cursive" font-size="20" font-weight="400" fill="#a9c8b4" >…and I integrated all of it into one app</text></g><g filter="url(#lift)"><rect x="700" y="86" width="210" height="228" rx="20" fill="#17233d" stroke="#27365a"/></g><rect x="724" y="86" width="162" height="4" rx="2" fill="#e3cf9f"/><g class="bob"><path d="M787 108 H823 V122 a18 18 0 0 1 -36 0 Z" fill="#e3cf9f" fill-opacity=".22" stroke="#e3cf9f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M787 113 h-8 a7 7 0 0 0 9 12" fill="none" stroke="#e3cf9f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M823 113 h8 a7 7 0 0 1 -9 12" fill="none" stroke="#e3cf9f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M805 140 v9 M794 154 h22 M797 149 h16 v5 h-16 Z" fill="none" stroke="#e3cf9f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M797 114 q2 10 7 14" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/></g><path class="twk" style="animation-delay:0s" d="M839 104 L840.8 108.2 L845 110 L840.8 111.8 L839 116 L837.2 111.8 L833 110 L837.2 108.2 Z" fill="#e3cf9f"/><path class="twk" style="animation-delay:1.2s" d="M773 133.5 L774.4 136.7 L777.5 138 L774.4 