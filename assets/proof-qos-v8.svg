<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Proof II, QoS Buddy: I led six engineers to a 1st Prize in Data Science at ESPRIT's Bal des Projets 2026. I designed the optimisation agent and the human approval gate, and integrated all agents into the final app; the optimiser cut regret 31% versus the rule baseline on 111 hold-out episodes (95% CI 7 to 59%)."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#142038"/></linearGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter><clipPath id="frame"><rect width="1200" height="430" rx="24"/></clipPath><linearGradient id="glossG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><style>
.d1{animation:d1 18s ease-in-out infinite}.d2{animation:d2 21s ease-in-out infinite}.d3{animation:d3 24s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,30px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-100px,-25px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-35px)}}
.pulse{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:2 9;animation:fw 1.4s linear infinite}@keyframes fw{to{stroke-dashoffset:-22}}
.breathe{animation:br 4s ease-in-out infinite}@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.sig{transform-box:fill-box;transform-origin:left center;animation:sg 10s ease-in-out infinite}
@keyframes sg{0%,62%{transform:scaleX(1);opacity:1}66%{transform:scaleX(1);opacity:0}67%{transform:scaleX(0);opacity:1}88%{transform:scaleX(1)}100%{transform:scaleX(1)}}
.railflow{stroke-dasharray:3 10;animation:rf 1.2s linear infinite}@keyframes rf{to{stroke-dashoffset:-26}}
.gloss{animation:gl 6s ease-in-out infinite}@keyframes gl{0%,40%{transform:translateX(-700px)}100%{transform:translateX(700px)}}
.rise{animation:ri 9s linear infinite}@keyframes ri{0%{transform:translateY(0);opacity:.0}15%{opacity:.8}100%{transform:translateY(-160px);opacity:0}}
.sweepT{animation:swt 6s ease-in-out infinite}@keyframes swt{0%,55%{transform:translateX(-260px) skewX(-18deg)}100%{transform:translateX(320px) skewX(-18deg)}}
.scan{animation:sc 4.5s ease-in-out infinite alternate}
.bob{animation:bb 3.2s ease-in-out infinite}@keyframes bb{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.twk{transform-box:fill-box;transform-origin:center;animation:tk 2.4s ease-in-out infinite}@keyframes tk{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}@keyframes sc{from{transform:translateX(0)}to{transform:translateX(380px)}}
