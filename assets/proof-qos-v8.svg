 episodes</text><clipPath id="tc930"><rect x="930" y="86" width="210" height="228" rx="20"/></clipPath><g clip-path="url(#tc930)"><rect class="sweepT" style="animation-delay:1.2s" x="870" y="70" width="70" height="260" fill="url(#glossG)" opacity=".25"/></g></g><rect x=".75" y=".75" width="1198.5" height="428.5" rx="23.25" fill="none" stroke="#27365a" stroke-width="1.5"/></svg>