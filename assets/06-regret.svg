<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="395" viewBox="0 0 1200 395" role="img" aria-label="Mean regret on 111 hold-out episodes: hybrid orchestrator 0.023, rule lookup 0.033, reward ranker 0.033, epsilon-greedy 0.041, LinUCB 0.053, LinUCB plus LLM layer 0.057. Hybrid is 31% lower than rules, 95% CI 7 to 59%."><defs>
