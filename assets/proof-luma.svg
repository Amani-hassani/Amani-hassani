<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Proof I, Luma: I refused to ship a model scoring 0.994 internally after it fell to 0.757 on 26,683 external images; the rebuilt model, locked before testing, reached 0.854 AUROC on 14,250 unseen images."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#f3f8ff"/></linearGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2b2e3b" flood-opacity=".12"/></filter><clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath></defs><style>
.d1{animation:d1 16s ease-in-out infinite}.d2{animation:d2 19s ease-in-out infinite}.d3{animation:d3 22s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,25px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-20px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
.pulse{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:2 9;animation:fw 1.4s linear infinite}@keyframes fw{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g clip-path="url(#frame)"><rect width="1200" height="400" fill="url(#bg)"/><g filter="url(#soft)"><circle class="d1" cx="144" cy="80" r="180" fill="#ffd8c9" opacity=".75"/><circle class="d2" cx="1056" cy="100" r="200" fill="#ffd6e0" opacity=".7"/><circle class="d3" cx="660" cy="420" r="180" fill="#fff0b8" opacity=".7"/></g><text x="64" y="74" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#d9694d" letter-spacing="3.2">PROOF I · LUMA · ESPRIT-TECH 2026</text><text x="64" y="124" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" fill="#2b2e3b" >I refused to ship a 0.994 model.</text><text x="64" y="172" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6c7080" >It looked perfect on its own test set. On 26,683 images</text><text x="64" y="200" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6c7080" >from another source, it fell to 0.757. I withheld it, rebuilt</text><text x="64" y="228" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6c7080" >the pipeline, and locked the new model before its test:</text><text x="64" y="270" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2b2e3b" >0.854 AUROC on 14,250 unseen images.</text><text x="64" y="318" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#d9694d" >github.com/Amani-hassani/luma-cxr  →</text><rect x="684" y="50" width="472" height="312" rx="20" fill="#ffffff" filter="url(#lift)"/><text x="760" y="336" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6c7080" >internal</text><text x="920" y="336" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6c7080" >external</text><text x="1080" y="336" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6c7080" >rebuilt, locked</text>
<line x1="720" y1="314" x2="1120" y2="314" stroke="#ece5da" stroke-width="2"/>
