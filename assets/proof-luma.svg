<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Proof I, Luma: I refused to ship a model scoring 0.994 internally after it fell to 0.757 on 26,683 external images; the rebuilt model, locked before testing, reached 0.854 AUROC on 14,250 unseen images."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121820"/><stop offset="1" stop-color="#1a2230"/></linearGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter><clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath><linearGradient id="glossG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><style>
.d1{animation:d1 18s ease-in-out infinite}.d2{animation:d2 21s ease-in-out infinite}.d3{animation:d3 24s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,30px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-100px,-25px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-35px)}}
.pulse{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:2 9;animation:fw 1.4s linear infinite}@keyframes fw{to{stroke-dashoffset:-22}}
.breathe{animation:br 4s ease-in-out infinite}@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.sig{transform-box:fill-box;transform-origin:left center;animation:sg 10s ease-in-out infinite}
@keyframes sg{0%,62%{transform:scaleX(1);opacity:1}66%{transform:scaleX(1);opacity:0}67%{transform:scaleX(0);opacity:1}88%{transform:scaleX(1)}100%{transform:scaleX(1)}}
.railflow{stroke-dasharray:3 10;animation:rf 1.2s linear infinite}@keyframes rf{to{stroke-dashoffset:-26}}
.gloss{animation:gl 6s ease-in-out infinite}@keyframes gl{0%,40%{transform:translateX(-700px)}100%{transform:translateX(700px)}}
.rise{animation:ri 9s linear infinite}@keyframes ri{0%{transform:translateY(0);opacity:.0}15%{opacity:.8}100%{transform:translateY(-160px);opacity:0}}
.sweepT{animation:swt 6s ease-in-out infinite}@keyframes swt{0%,55%{transform:translateX(-260px) skewX(-18deg)}100%{transform:translateX(320px) skewX(-18deg)}}
.scan{animation:sc 4.5s ease-in-out infinite alternate}@keyframes sc{from{transform:translateX(0)}to{transform:translateX(380px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g clip-path="url(#frame)"><rect width="1200" height="400" fill="url(#bg)"/><g filter="url(#soft)" opacity=".38"><circle class="d1" cx="144" cy="60" r="180" fill="#e8b4a0"/><circle class="d2" cx="1080" cy="80" r="200" fill="#d9a3ae"/><circle class="d3" cx="600" cy="440" r="180" fill="#e3cf9f"/></g><line x1="34" y1="0" x2="34" y2="400" stroke="#2b3442" stroke-width="3"/><line x1="34" y1="0" x2="34" y2="400" stroke="#e8b4a0" stroke-opacity=".8" stroke-width="2" class="railflow"/><circle class="pulse" cx="34" cy="69" r="13" fill="#e8b4a0" opacity=".35"/><circle cx="34" cy="69" r="7" fill="#121820" stroke="#e8b4a0" stroke-width="2.5"/><text font-size="18" fill="#f3eee6" text-anchor="middle" dominant-baseline="central">✈<animateMotion dur="7s" repeatCount="indefinite" rotate="auto" path="M34 0 V400"/></text><text x="64" y="74" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e8b4a0" letter-spacing="3.2">LEG 1 · LUMA · ESPRIT-TECH 2026</text><text x="64" y="124" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" fill="#f3eee6" >I refused to ship a 0.994 model.</text><text x="64" y="172" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#a7adba" >It looked perfect on its own test set. On 26,683 images</text><text x="64" y="200" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#a7adba" >from another source, it fell to 0.757. I withheld it, rebuilt</text><text x="64" y="228" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#a7adba" >the pipeline, and locked the new model before its test:</text><text x="64" y="270" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f3eee6" >0.854 AUROC on 14,250 unseen images.</text><text x="64" y="318" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e8b4a0" >Luma · chest X-ray AI in a secure, tested app  →</text><rect x="684" y="50" width="472" height="312" rx="20" fill="#1c2431" stroke="#2b3442" filter="url(#lift)"/><text x="760" y="336" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a7adba" >internal</text><text x="920" y="336" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a7adba" >external</text><text x="1080" y="336" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a7adba" >rebuilt, locked</text>
