<circle class="pulse" cx="1080" cy="193" r="17" fill="#cdeedd"/><circle cx="1080" cy="193" r="8" fill="#2f8f66"/>
<text x="1080" y="173.22666666666663" text-anchor="middle" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#2f8f66" >0.854</text>
<g transform="rotate(-10 910 172)"><rect x="834" y="151" width="152" height="42" rx="8" fill="#ffd6e0" fill-opacity=".55" stroke="#c9506f" stroke-width="2.5"/>
