<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-label="Boarding pass. Passenger Amani Hassani, from ESPRIT Tunis to your AI team. 6-month PFE departing January 2027 in Tunisia or April 2027 in Europe. Gate: applied AI and ML engineering. Email hassani.amani@esprit.tn."><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0a1f"/><stop offset="1" stop-color="#1a1240"/></linearGradient>
<linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6f61"/><stop offset=".35" stop-color="#ffc857"/><stop offset=".7" stop-color="#b388ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="frame"><rect width="1200" height="370" rx="22"/></clipPath></defs><style>
.drift1{animation:d1 14s ease-in-out infinite}.drift2{animation:d2 17s ease-in-out infinite}.drift3{animation:d3 20s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,30px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-90px,-25px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-40px)}}
.pulse{animation:pu 2.6s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.flow{stroke-dasharray:6 10;animation:fw 1.2s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}
.sweep{animation:sw 6s ease-in-out infinite}@keyframes sw{0%,55%{transform:translateX(-300px) skewX(-20deg)}100%{transform:translateX(1500px) skewX(-20deg)}}
.twinkle{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sweept{animation:stt 5s ease-in-out infinite}@keyframes stt{0%,50%{transform:translateX(-300px) skewX(-20deg)}100%{transform:translateX(1500px) skewX(-20deg)}}</style><g clip-path="url(#frame)"><rect width="1200" height="370" fill="url(#bg)"/><g filter="url(#blur)" opacity=".55"><circle class="drift1" cx="216" cy="92" r="155" fill="#ff6f61" opacity=".45"/><circle class="drift2" cx="936" cy="111" r="166" fill="#b388ff" opacity=".45"/><circle class="drift3" cx="600" cy="352" r="148" fill="#4f8cff" opacity=".35"/></g><rect x="40" y="40" width="1120" height="290" rx="20" fill="#fbf7ff"/><rect x="40" y="40" width="1120" height="62" rx="20" fill="url(#aurora)"/><rect x="40" y="80" width="1120" height="22" fill="url(#aurora)"/><text x="72" y="81" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1a1240" letter-spacing="3">BOARDING PASS · STOP 05 · YOUR TEAM</text><text x="1128" y="81" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1a1240" >PFE 2027 ✈</text><line x1="880" y1="112" x2="880" y2="318" stroke="#c9c0e6" stroke-width="2" stroke-dasharray="6 7"/><circle cx="880" cy="40" r="14" fill="#0b0a1f"/><circle cx="880" cy="330" r="14" fill="#0b0a1f"/><text x="72" y="140" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7a6fa8" letter-spacing="2">PASSENGER</text><text x="72" y="166" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1a1240" >Amani Hassani</text><text x="400" y="140" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7a6fa8" letter-spacing="2">FROM</text><text x="400" y="166" text-anc