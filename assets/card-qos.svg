<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-label="QoS Buddy: Multi-agent AI · team lead. 🏆 1st Prize · −31% regret · 6-person team">
<defs>
