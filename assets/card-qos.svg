</style>
<rect width="580" height="250" rx="20" fill="url(#bg)"/><rect width="580" height="250" rx="20" fill="url(#glowA)"/><rect width="580" height="250" rx="20" fill="url(#glowB)"/>
<clipPath id="cc"><rect width="580" height="250" rx="20"/></clipPath>
<rect width="580" height="6" fill="url(#edge)" clip-path="url(#cc)"/>
<g clip-path="url(#cc)"><rect class="sweep" x="-120" y="-20" width="110" height="290" fill="url(#shine)"/></g>
<rect class="rim" x="1" y="1" width="578" height="248" rx="19" fill="none" stroke="#5ee0ff" stroke-width="2"/>
<text x="32" y="58" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2.5" font-weight="600" fill="#5ee0ff">MULTI-AGENT AI · TEAM LEAD</text>
