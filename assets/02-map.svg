<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Tour map: 01 The refusal, 02 Six agents, 03 How I build, 04 The road here, 05 Your team."><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0a1f"/><stop offset="1" stop-color="#1a1240"/></linearGradient>
<linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6f61"/><stop offset=".35" stop-color="#ffc857"/><stop offset=".7" stop-color="#b388ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="frame"><rect width="1200" height="220" rx="22"/></clipPath></defs><style>
.drift1{animation:d1 14s ease-in-out infinite}.drift2{animation:d2 17s ease-in-out infinite}.drift3{animation:d3 20s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,30px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-90px,-25px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-40px)}}
.pulse{animation:pu 2.6s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.flow{stroke-dasharray:6 10;animation:fw 1.2s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}
.sweep{animation:sw 6s ease-in-out infinite}@keyframes sw{0%,55%{transform:translateX(-300px) skewX(-20deg)}100%{transform:translateX(1500px) skewX(-20deg)}}
.twinkle{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g clip-path="url(#frame)"><rect width="1200" height="220" fill="url(#bg)"/><text x="60" y="46" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5" fill="#ffc857">TOUR MAP</text><text x="1140" y="46" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b9b3d9" >five stops · scroll to follow</text><path id="route" d="M80 120 H1120" fill="none" stroke="#2c2563" stroke-width="10" stroke-linecap="round"/><path d="M80 120 H1120" fill="none" stroke="url(#aurora)" stroke-width="4" stroke-linecap="round" class="flow"/><circle class="pulse" cx="80" cy="120" r="22" fill="#ff6f61" opacity=".25"/><circle cx="80" cy="120" r="14" fill="#151036" stroke="#ff6f61" stroke-width="3"/><text x="80" y="125" text-anchor="middle" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#f5f3ff" >01</text><text x="80" y="172" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f5f3ff" >The refusal</text><circle class="pulse" cx="340" cy="120" r="22" fill="#4f8cff" opacity=".25"/><circle cx="340" cy="120" r="14" fill="#151036" stroke="#4f8cff" stroke-width="3"/><text x="340" y="125" text-anchor="middle" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#f5f3ff" >02</text><text x="340" y="172" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f5f3ff" >Six agents</text><circle class="pulse" cx="600" cy="120" r="22" fill="#b388ff" opacity=".25"/><circle cx="600" cy="120" r="14" fill="#151036" stroke="#b388ff" stroke-width="3"/><text x="600" y="125" text-anchor="middle" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#f5f3ff" >03</text><text x="600" y="172" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f5f3ff" >How I build</text><circle class="pulse" cx="860" cy="120" r="22" fill="#ffc857" opacity=".25"/><circle cx="860" cy="120" r="14" fill="#151036" stroke="#ffc857" stroke-width="3"/><text x="860" y="125" text-anchor="middle" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#f5f3ff" >04</text><text x="860" y="172" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f5f3ff" >The road here</text><circle class="pulse" cx="1120" cy="120" r="22" fill="#ff5fa2" opacity=".25"/><circle cx="1120" cy="120" r="14" fill="#151036" stroke="#ff5fa2" stroke-width="3"/><text x="1120" y="125" text-anchor="middle" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#f5f3ff" >05</text><text x="1120" y="172" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f5f3ff" >Your team</text><circle r="8" fill="#ffc857" filter="url(#glow)"><animateMotion dur="9s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle></g><rect x=".75" y=".75" width="1198.5" height="218.5" rx="21.25" fill="none" stroke="#2c2563" stroke-width="1.5"/></svg>