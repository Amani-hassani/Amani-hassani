<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Amani Hassani. Final-year Data Science engineer, applied AI and ML engineering, Tunis. Mission: AI that keeps its promises outside the notebook."><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0a1f"/><stop offset="1" stop-color="#1a1240"/></linearGradient>
<linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6f61"/><stop offset=".35" stop-color="#ffc857"/><stop offset=".7" stop-color="#b388ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffc857"/><stop offset=".3" stop-color="#ff6f61"/><stop offset=".6" stop-color="#ff5fa2"/><stop offset="1" stop-color="#b388ff"/>
<animate attributeName="x1" values="0;-.6;0" dur="8s" repeatCount="indefinite"/><animate attributeName="x2" values="1;1.6;1" dur="8s" repeatCount="indefinite"/></linearGradient><clipPath id="frame"><rect width="1200" height="460" rx="22"/></clipPath></defs><style>
.drift1{animation:d1 14s ease-in-out infinite}.drift2{animation:d2 17s ease-in-out infinite}.drift3{animation:d3 20s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,30px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-90px,-25px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-40px)}}
.pulse{animation:pu 2.6s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.flow{stroke-dasharray:6 10;animation:fw 1.2s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}
.sweep{animation:sw 6s ease-in-out infinite}@keyframes sw{0%,55%{transform:translateX(-300px) skewX(-20deg)}100%{transform:translateX(1500px) skewX(-20deg)}}
.twinkle{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}.spin{animation:sp 30s linear infinite;transform-origin:960px 215px}.spinr{animation:sp 22s linear infinite reverse;transform-origin:960px 215px}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bo 1.8s ease-in-out infinite}@keyframes bo{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}</style><g clip-path="url(#frame)"><rect width="1200" height="460" fill="url(#bg)"/><g filter="url(#blur)" opacity=".55"><circle class="drift1" cx="216" cy="115" r="193" fill="#ff6f61" opacity=".45"/><circle class="drift2" cx="936" cy="138" r="207" fill="#b388ff" opacity=".45"/><circle class="drift3" cx="600" cy="437" r="184" fill="#4f8cff" opacity=".35"/></g><text x="70" y="78" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5" fill="#ffc857">WELCOME TO MY WORLD · A 60-SECOND TOUR</text><text x="66" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="80" fill="url(#nameG)">Amani Hassani</text><text x="70" y="200" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b9b3d9" >Final-year Data Science engineer · Applied AI &amp; ML engineering · Tunis</text><text x="70" y="258" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffc857" >My mission:</text><text x="204" y="258" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#f5f3ff" >AI that keeps its promises</text><text x="70" y="288" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#f5f3ff" >outside the notebook.</text><rect x="70" y="320" width="318" height="32" rx="16.0" fill="#151036" stroke="#ff6f61" stroke-opacity=".75"/><text x="229.04000000000002" y="341.04" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f5f3ff" >0.994 → 0.757: caught it, withheld it</text><rect x="400.08000000000004" y="320" width="208" height="32" rx="16.0" fill="#151036" stroke="#ffc857" stroke-opacity=".75"/><text x="504.24000000000007" y="341.04" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f5f3ff" >🏆 1st Prize · team lead</text><rect x="620.4000000000001" y="320" width="224" height="32" rx="16.0" fill="#151036" stroke="#b388ff" stroke-opacity=".75"/><text x="732.4000000000001" y="341.04" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f5f3ff" >model → API → app, tested</text><g class="bob"><text x="70" y="410" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#b9b3d9" >The tour starts below  ↓</text></g><circle cx="960" cy="215" r="150" fill="none" stroke="#2c2563" stroke-width="1.5"/><circle cx="960" cy="215" r="105" fill="none" stroke="#2c2563" stroke-width="1.5" stroke-dasharray="3 7"/><circle cx="960" cy="215" r="60" fill="#151036" stroke="url(#aurora)" stroke-width="2.5"/><text x="960" y="211" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#f5f3ff" >AI</text><text x="960" y="235" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b9b3d9" >that ships</text><g class="spin"><circle cx="1110.0" cy="215.0" r="7" fill="#ff6f61" filter="url(#glow)"/><text x="1110.0" y="202.0" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f3ff" >PyTorch</text><circle cx="960.0" cy="365.0" r="7" fill="#ffc857" filter="url(#glow)"/><text x="960.0" y="352.0" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f3ff" >RAG</text><circle cx="810.0" cy="215.0" r="7" fill="#b388ff" filter="url(#glow)"/><text x="810.0" y="202.00000000000003" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f3ff" >FastAPI</text><circle cx="960.0" cy="65.0" r="7" fill="#4f8cff" filter="url(#glow)"/><text x="960.0" y="52.0" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f3ff" >CI/CD</text></g><g class="spinr"><circle cx="1034.2" cy="289.2" r="7" fill="#ff5fa2" filter="url(#glow)"/><text x="1034.2462120245875" y="276.2462120245875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f3ff" >ONNX</text><circle cx="885.8" cy="289.2" r="7" fill="#4f8cff" filter="url(#glow)"/><text x="885.7537879754125" y="276.2462120245875" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f3ff" >Agents</text><circle cx="885.8" cy="140.8" r="7" fill="#ffc857" filter="url(#glow)"/><text x="885.7537879754125" y="127.75378797541254" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f3ff" >Security</text><circle cx="1034.2" cy="140.8" r="7" fill="#ff6f61" filter="url(#glow)"/><text x="1034.2462120245875" y="127.75378797541248" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f5f3ff" >MLflow</text></g></g><rect x=".75" y=".75" width="1198.5" height="458.5" rx="21.25" fill="none" stroke="#2c2563" stroke-width="1.5"/></svg>