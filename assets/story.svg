<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="The model I refused to ship: internal AUROC 0.994 fell to 0.757 on external data, so it was withheld; the rebuilt model reached 0.854 on 14,250 unseen images.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060d1a"/><stop offset="1" stop-color="#0d2233"/></linearGradient>
  <radialGradient id="glowA" cx="0.15" cy="0.2" r="0.6"><stop offset="0" stop-color="#3fd6c1" stop-opacity="0.16"/><stop offset="1" stop-color="#3fd6c1" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.6"><stop offset="0" stop-color="#8b9cff" stop-opacity="0.14"/><stop offset="1" stop-color="#8b9cff" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fd6c1"/><stop offset="0.5" stop-color="#5ee0ff"/><stop offset="1" stop-color="#8b9cff"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.42" stop-color="#ffffff"/><stop offset="0.5" stop-color="#3fd6c1"/><stop offset="0.58" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/>
    <animate attributeName="x1" values="-1.2;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-0.2;2" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:dr 1.6s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}.pop{opacity:0;animation:pop .5s cubic-bezier(.2,1.6,.4,1) forwards}@keyframes pop{from{opacity:0;transform:scale(1.8) rotate(-14deg)}to{opacity:1;transform:scale(1) rotate(-14deg)}}.fade{opacity:0;animation:fd .8s ease forwards}@keyframes fd{to{opacity:1}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="1200" height="380" rx="20" fill="url(#bg)"/><rect width="1200" height="380" rx="20" fill="url(#glowA)"/><rect width="1200" height="380" rx="20" fill="url(#glowB)"/>
<text x="60" y="78" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#3fd6c1" font-weight="600">CASE FILE · ESPRIT-TECH 2026</text>
<text x="60" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#ffffff">The model I refused to ship.</text>
<text x="60" y="176" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#cbd8e4">My pneumonia classifier scored 0.994 AUROC on its own</text>
<text x="60" y="200" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#cbd8e4">test set. On 26,683 images from another source, it fell to</text>
<text x="60" y="224" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#cbd8e4">0.757, with specificity at 0.37. So I withheld it, rebuilt</text>
<text x="60" y="248" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#cbd8e4">the pipeline, and locked the new model before testing it.</text>
<text x="60" y="300" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="600">Good-looking metrics are a hypothesis.</text>
<text x="60" y="325" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="600">External data is the experiment.</text><rect x="670" y="40" width="500" height="320" rx="16" fill="#0a1424" stroke="#1d3a50"/><line x1="700" y1="278" x2="1140" y2="278" stroke="#16304a" stroke-dasharray="4 6"/><text x="692" y="283" text-anchor="end" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#5d7896">0.75</text><line x1="700" y1="195" x2="1140" y2="195" stroke="#16304a" stroke-dasharray="4 6"/><text x="692" y="200" text-anchor="end" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#5d7896">0.85</text><line x1="700" y1="112" x2="1140" y2="112" stroke="#16304a" stroke-dasharray="4 6"/><text x="692" y="117" text-anchor="end" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#5d7896">0.95</text><text x="760" y="350" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8aa3bf">internal test</text>
<text x="930" y="350" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8aa3bf">external · 26,683</text>
<text x="1090" y="350" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8aa3bf">rebuilt · 14,250 unseen</text>
<path class="draw" d="M760 75 L930 272" stroke="#ff6b6b" stroke-width="4" fill="none" stroke-linecap="round"/>
<circle cx="760" cy="75" r="7" fill="#ffffff"/><text x="760" y="59" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" fill="#ffffff" font-weight="700">0.994</text>
<g class="fade" style="animation-delay:1.4s"><circle cx="930" cy="272" r="7" fill="#ff6b6b"/><text x="930" y="302" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="16" fill="#ff6b6b" font-weight="700">0.757</text></g>
<g class="pop" style="animation-delay:1.9s; transform-origin:930px 153px">
  <rect x="848" y="131" width="164" height="44" rx="6" fill="none" stroke="#ff6b6b" stroke-width="3.5"/>
  <text x="930" y="162" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="22" font-weight="700" fill="#ff6b6b" letter-spacing="3">WITHHELD</text>
</g>
<path class="draw" style="animation-delay:2.6s" d="M930 272 C990 272 1020 192 1090 192" stroke="#3fd6c1" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="1000"/>
<g class="fade" style="animation-delay:3.8s"><circle cx="1090" cy="192" r="8" fill="#3fd6c1"/>
<text x="1090" y="174" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="17" fill="#3fd6c1" font-weight="700">0.854</text>
<text x="1090" y="226" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#9fd8cf">95% CI 0.839–0.869</text></g></svg>