<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Stop 03. How I build: lock first, test second; report what I didn't prove; ship it like software; security is a feature."><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0a1f"/><stop offset="1" stop-color="#1a1240"/></linearGradient>
<linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6f61"/><stop offset=".35" stop-color="#ffc857"/><stop offset=".7" stop-color="#b388ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="frame"><rect width="1200" height="330" rx="22"/></clipPath></defs><style>
.drift1{animation:d1 14s ease-in-out infinite}.drift2{animation:d2 17s ease-in-out infinite}.drift3{animation:d3 20s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,30px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-90px,-25px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-40px)}}
.pulse{animation:pu 2.6s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.flow{stroke-dasharray:6 10;animation:fw 1.2s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}
.sweep{animation:sw 6s ease-in-out infinite}@keyframes sw{0%,55%{transform:translateX(-300px) skewX(-20deg)}100%{transform:translateX(1500px) skewX(-20deg)}}
.twinkle{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g clip-path="url(#frame)"><rect width="1200" height="330" fill="url(#bg)"/><g filter="url(#blur)" opacity=".55"><circle class="drift1" cx="216" cy="82" r="139" fill="#ff6f61" opacity=".45"/><circle class="drift2" cx="936" cy="99" r="148" fill="#b388ff" opacity=".45"/><circle class="drift3" cx="600" cy="314" r="132" fill="#4f8cff" opacity=".35"/></g><text x="60" y="64" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5" fill="#b388ff">STOP 03 · HOW I BUILD</text><text x="60" y="104" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" fill="#f5f3ff" >Four rules I don't break. Each one is visible in my repos.</text><g class="float" style="animation-delay:0.0s"><rect x="60" y="132" width="252" height="168" rx="16" fill="#151036" stroke="#ff6f61" stroke-opacity=".7"/><rect x="60" y="132" width="252" height="5" rx="2" fill="#ff6f61"/><rect x="84" y="174" width="32" height="26" rx="5" stroke="#ff6f61" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 174 v-8 a10 10 0 0 1 20 0 v8" stroke="#ff6f61" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="187" r="3" fill="#ff6f61"/><text x="84" y="230" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f5f3ff" >Lock first, test second.</text><text x="84" y="256" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b9b3d9" >The model is frozen before</text><text x="84" y="276" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b9b3d9" >it meets its external test set.</text></g><g class="float" style="animation-delay:0.5s"><rect x="332" y="132" width="252" height="168" rx="16" fill="#151036" stroke="#ffc857" stroke-opacity=".7"/><rect x="332" y="132" width="252" height="5" rx="2" fill="#ffc857"/><circle cx="368" cy="176" r="13" stroke="#ffc857" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M378 186 l12 12" stroke="#ffc857" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M362 176 h12" stroke="#ffc857" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="356" y="230" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f5f3ff" >Report what I didn't prove.</text><text x="356" y="256" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b9b3d9" >Every claim ships with its</text><text x="356" y="276" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b9b3d9" >limits and confidence intervals.</text></g><g class="float" style="animation-delay:1.0s"><rect x="604" y="132" width="252" height="168" rx="16" fill="#151036" stroke="#b388ff" stroke-opacity=".7"/><rect x="604" y="132" width="252" height="5" rx="2" fill="#b388ff"/><path d="M626 186 h36 l-6 12 h-24 z" stroke="#b388ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M644 186 v-26 l14 18 h-14" stroke="#b388ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="628" y="230" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f5f3ff" >Ship it like software.</text><text x="628" y="256" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b9b3d9" >Tests, CI and verified</text><text x="628" y="276" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b9b3d9" >artefacts, not only notebooks.</text></g><g class="float" style="animation-delay:1.5s"><rect x="876" y="132" width="252" height="168" rx="16" fill="#151036" stroke="#4f8cff" stroke-opacity=".7"/><rect x="876" y="132" width="252" height="5" rx="2" fill="#4f8cff"/><path d="M916 158 l18 7 v10 c0 12 -8 20 -18 24 c-10 -4 -18 -12 -18 -24 v-10 z" stroke="#4f8cff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M909 179 l5 5 l10 -10" stroke="#4f8cff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="900" y="230" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#f5f3ff" >Security is a feature.</text><text x="900" y="256" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b9b3d9" >Encryption, RBAC and audit</text><text x="900" y="276" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#b9b3d9" >logs designed in from day one.</text></g></g><rect x=".75" y=".75" width="1198.5" height="328.5" rx="21.25" fill="none" stroke="#2c2563" stroke-width="1.5"/></svg>