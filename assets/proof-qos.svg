<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Proof II, QoS Buddy: I led six engineers to a 1st Prize in Data Science at ESPRIT's Bal des Projets 2026. I designed the optimisation agent and the human approval gate; the optimiser cut regret 31% versus the rule baseline on 111 hold-out episodes (95% CI 7 to 59%)."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121820"/><stop offset="1" stop-color="#1a2230"/></linearGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter><clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath></defs><style>
.d1{animation:d1 18s ease-in-out infinite}.d2{animation:d2 21s ease-in-out infinite}.d3{animation:d3 24s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,30px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-100px,-25px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-35px)}}
.pulse{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:2 9;animation:fw 1.4s linear infinite}@keyframes fw{to{stroke-dashoffset:-22}}
.breathe{animation:br 4s ease-in-out infinite}@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.sig{transform-box:fill-box;transform-origin:left center;animation:sg 10s ease-in-out infinite}
@keyframes sg{0%,62%{transform:scaleX(1);opacity:1}66%{transform:scaleX(1);opacity:0}67%{transform:scaleX(0);opacity:1}88%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g clip-path="url(#frame)"><rect width="1200" height="400" fill="url(#bg)"/><g filter="url(#soft)" opacity=".38"><circle class="d1" cx="144" cy="60" r="180" fill="#9fb8d6"/><circle class="d2" cx="1080" cy="80" r="200" fill="#a9c8b4"/><circle class="d3" cx="600" cy="440" r="180" fill="#e3cf9f"/></g><text x="64" y="74" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9fb8d6" letter-spacing="3.2">PROOF II · QOS BUDDY · CAPSTONE WITH AMARIS</text><text x="64" y="124" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" fill="#f3eee6" >I led six engineers to a 1st Prize.</text><text x="64" y="172" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#a7adba" >A multi-agent AI that watches a network, finds the fault</text><text x="64" y="200" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#a7adba" >and proposes a fix. I designed the agent that chooses</text><text x="64" y="228" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#a7adba" >the fix, and the gate where a human approves it.</text><path id="pipe" d="M84 300 H600" stroke="#2b3442" stroke-width="3"/><path d="M84 300 H600" stroke="#9fb8d6" stroke-width="2" class="flow"/><circle cx="84" cy="300" r="6" fill="#1c2431" stroke="#9fb8d6" stroke-width="2"/><text x="84.0" y="330" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a7adba" >monitor</text><circle cx="170" cy="300" r="6" fill="#1c2431" stroke="#9fb8d6" stroke-width="2"/><text x="170.0" y="330" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a7adba" >detect</text><circle cx="256" cy="300" r="6" fill="#1c2431" stroke="#9fb8d6" stroke-width="2"/><text x="256.0" y="330" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a7adba" >predict</text><circle cx="342" cy="300" r="6" fill="#1c2431" stroke="#9fb8d6" stroke-width="2"/><text x="342.0" y="330" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a7adba" >diagnose</text><circle cx="428" cy="300" r="9" fill="#1c2431" stroke="#e8b4a0" stroke-width="3"/><text x="428.0" y="330" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f3eee6" >optimise</text><circle cx="514" cy="300" r="9" fill="#1c2431" stroke="#e8b4a0" stroke-width="3"/><text x="514.0" y="330" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f3eee6" >approve</text><circle cx="600" cy="300" r="6" fill="#1c2431" stroke="#9fb8d6" stroke-width="2"/><text x="600.0" y="330" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a7adba" >report</text><path d="M414 278 H528" stroke="#e8b4a0" stroke-width="2" stroke-linecap="round"/><text x="471.0" y="268" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e8b4a0" letter-spacing="1.5">designed by me</text><circle r="5" fill="#e3cf9f"><animateMotion dur="6s" repeatCount="indefinite" path="M84 300 H600"/></circle><g filter="url(#lift)"><rect x="700" y="86" width="210" height="228" rx="20" fill="#1c2431" stroke="#2b3442"/></g><rect x="724" y="86" width="162" height="4" rx="2" fill="#e3cf9f"/><text x="805" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="400" fill="#e3cf9f" >1st</text><text x="805" y="236" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3eee6" >Prize in Data Science</text><text x="805" y="262" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a7adba" >ESPRIT Bal des Projets 2026</text><g filter="url(#lift)"><rect x="930" y="86" width="210" height="228" rx="20" fill="#1c2431" stroke="#2b3442"/></g><rect x="954" y="86" width="162" height="4" rx="2" fill="#9fb8d6"/><text x="1035" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="400" fill="#9fb8d6" >−31%</text><text x="1035" y="236" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f3eee6" >regret vs rule baseline</text><text x="1035" y="262" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a7adba" >95% CI 7–59% · 111 episodes</text></g><rect x=".75" y=".75" width="1198.5" height="398.5" rx="23.25" fill="none" stroke="#2b3442" stroke-width="1.5"/></svg>