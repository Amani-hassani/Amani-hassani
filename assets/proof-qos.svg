<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Proof II, QoS Buddy: I led six engineers to a 1st Prize in Data Science at ESPRIT's Bal des Projets 2026. My optimisation agent cut regret 31% versus the rule baseline on 111 hold-out episodes (95% CI 7 to 59%)."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#f3f8ff"/></linearGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2b2e3b" flood-opacity=".12"/></filter><clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath></defs><style>
.d1{animation:d1 16s ease-in-out infinite}.d2{animation:d2 19s ease-in-out infinite}.d3{animation:d3 22s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,25px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-20px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
.pulse{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:2 9;animation:fw 1.4s linear infinite}@keyframes fw{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g clip-path="url(#frame)"><rect width="1200" height="360" fill="url(#bg)"/><g filter="url(#soft)"><circle class="d1" cx="144" cy="72" r="162" fill="#d4e8ff" opacity=".75"/><circle class="d2" cx="1056" cy="90" r="180" fill="#cdeedd" opacity=".7"/><circle class="d3" cx="660" cy="378" r="162" fill="#fff0b8" opacity=".7"/></g><text x="64" y="74" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3a78bd" letter-spacing="3.2">PROOF II · QOS BUDDY · CAPSTONE WITH AMARIS</text><text x="64" y="124" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" fill="#2b2e3b" >I led six engineers to a 1st Prize.</text><text x="64" y="172" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6c7080" >A multi-agent AI that watches a network, finds the fault</text><text x="64" y="200" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6c7080" >and proposes a fix to a human. I built the agent that</text><text x="64" y="228" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6c7080" >chooses the fix, and benchmarked it honestly.</text><text x="64" y="296" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3a78bd" >github.com/Amani-hassani/Esprit-PIDS-4DS4-2026-QOS_Buddy  →</text><rect x="700" y="70" width="210" height="220" rx="20" fill="#ffffff" filter="url(#lift)"/><rect x="700" y="70" width="210" height="8" rx="4" fill="#fff0b8"/><text x="805" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="400" fill="#b5850c" >1st</text><text x="805" y="214" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2e3b" >Prize in Data Science</text><text x="805" y="240" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6c7080" >ESPRIT Bal des Projets 2026</text><rect x="930" y="70" width="210" height="220" rx="20" fill="#ffffff" filter="url(#lift)"/><rect x="930" y="70" width="210" height="8" rx="4" fill="#d4e8ff"/><text x="1035" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="400" fill="#3a78bd" >−31%</text><text x="1035" y="214" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2b2e3b" >regret vs rule baseline</text><text x="1035" y="240" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6c7080" >95% CI 7–59% · 111 episodes</text></g><rect x=".75" y=".75" width="1198.5" height="358.5" rx="23.25" fill="none" stroke="#ece5da" stroke-width="1.5"/></svg>