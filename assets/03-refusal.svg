<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Stop 01. The model I refused to ship: internal AUROC 0.994 fell to 0.757 on 26,683 external images, so it was withheld. The rebuilt model reached 0.854 on 14,250 unseen images."><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0a1f"/><stop offset="1" stop-color="#1a1240"/></linearGradient>
<linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6f61"/><stop offset=".35" stop-color="#ffc857"/><stop offset=".7" stop-color="#b388ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="reb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b388ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient><clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath></defs><style>
.drift1{animation:d1 14s ease-in-out infinite}.drift2{animation:d2 17s ease-in-out infinite}.drift3{animation:d3 20s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,30px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-90px,-25px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-40px)}}
.pulse{animation:pu 2.6s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.45}50%{opacity:1}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.flow{stroke-dasharray:6 10;animation:fw 1.2s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}
.sweep{animation:sw 6s ease-in-out infinite}@keyframes sw{0%,55%{transform:translateX(-300px) skewX(-20deg)}100%{transform:translateX(1500px) skewX(-20deg)}}
.twinkle{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:dr 1.6s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}.stamp{animation:st 3.5s ease-in-out infinite;transform-origin:var(--o)}@keyframes st{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(-12deg) scale(1.06)}}</style><g clip-path="url(#frame)"><rect width="1200" height="400" fill="url(#bg)"/><g filter="url(#blur)" opacity=".55"><circle class="drift1" cx="216" cy="100" r="168" fill="#ff6f61" opacity=".45"/><circle class="drift2" cx="936" cy="120" r="180" fill="#b388ff" opacity=".45"/><circle class="drift3" cx="600" cy="380" r="160" fill="#4f8cff" opacity=".35"/></g><text x="60" y="70" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5" fill="#ff6f61">STOP 01 · THE REFUSAL · ESPRIT-TECH 2026</text><text x="60" y="122" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="400" fill="#f5f3ff" >The model I refused to ship.</text><text x="60" y="170" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#b9b3d9" >My pneumonia classifier scored 0.994 AUROC on its own</text><text x="60" y="195" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#b9b3d9" >test set. On 26,683 images from another source, it fell to</text><text x="60" y="220" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#b9b3d9" >0.757, with specificity at 0.37. So I withheld it, rebuilt</text><text x="60" y="245" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#b9b3d9" >the pipeline, and locked the new model before testing it.</text><text x="60" y="300" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffc857" >Good-looking metrics are a hypothesis.</text><text x="60" y="326" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f5f3ff" >External data is the experiment.</text><rect x="670" y="36" width="500" height="324" rx="16" fill="#151036" stroke="#2c2563"/><line x1="700" y1="278" x2="1140" y2="278" stroke="#2c2563" stroke-dasharray="4 6"/><text x="692" y="283.3333333333333" text-anchor="end" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#7d74b3" >0.75</text><line x1="700" y1="195" x2="1140" y2="195" stroke="#2c2563" stroke-dasharray="4 6"/><text x="692" y="199.99999999999997" text-anchor="end" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#7d74b3" >0.85</text><line x1="700" y1="112" x2="1140" y2="112" stroke="#2c2563" stroke-dasharray="4 6"/><text x="692" y="116.66666666666666" text-anchor="end" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#7d74b3" >0.95</text><text x="760" y="350" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b9b3d9" >internal test</text><text x="930" y="350" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b9b3d9" >external · 26,683</text><text x="1090" y="350" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b9b3d9" >rebuilt · 14,250 unseen</text>
<path d="M760 75 L930 272" stroke="#ff6f61" stroke-width="4" fill="none" stroke-linecap="round"/>
<circle cx="760" cy="75" r="7" fill="#f5f3ff"/><text x="760" y="58.99999999999994" text-anchor="middle" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#f5f3ff" >0.994</text>
<circle cx="930" cy="272" r="7" fill="#ff6f61"/><text x="930" y="302.49999999999994" text-anchor="middle" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="16" font-weight="700" fill="#ff6f61" >0.757</text>
<g class="stamp" style="--o:930px 153px"><rect x="848" y="131" width="164" height="44" rx="6" fill="#0b0a1f" fill-opacity=".6" stroke="#ff6f61" stroke-width="3.5"/>
<text x="930" y="162.33333333333326" text-anchor="middle" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="22" font-weight="700" fill="#ff6f61" letter-spacing="3">WITHHELD</text></g>
<path d="M930 272 C990 272 1020 192 1090 192" stroke="url(#reb)" stroke-width="4" fill="none" stroke-linecap="round" class="flow"/>
<circle class="pulse" cx="1090" cy="192" r="16" fill="#4f8cff" opacity=".3"/><circle cx="1090" cy="192" r="8" fill="#4f8cff"/>
<text x="1090" y="173.66666666666666" text-anchor="middle" font-family="'Cascadia Code', Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#4f8cff" >0.854</text><text x="1090" y="225.66666666666666" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b9b3d9" >95% CI 0.839–0.869</text></g><rect x=".75" y=".75" width="1198.5" height="398.5" rx="21.25" fill="none" stroke="#2c2563" stroke-width="1.5"/></svg>