<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Amani Hassani. Applied AI and machine learning engineering, Tunis. Vision: AI that keeps its promises outside the notebook. I build models that survive unseen data, agents that ask a human first, and software that ships with tests. Open to a 6-month PFE in 2027."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#142038"/></linearGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter><clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath><linearGradient id="glossG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><style>
.d1{animation:d1 18s ease-in-out infinite}.d2{animation:d2 21s ease-in-out infinite}.d3{animation:d3 24s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,30px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-100px,-25px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-35px)}}
.pulse{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:2 9;animation:fw 1.4s linear infinite}@keyframes fw{to{stroke-dashoffset:-22}}
.breathe{animation:br 4s ease-in-out infinite}@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.sig{transform-box:fill-box;transform-origin:left center;animation:sg 10s ease-in-out infinite}
@keyframes sg{0%,62%{transform:scaleX(1);opacity:1}66%{transform:scaleX(1);opacity:0}67%{transform:scaleX(0);opacity:1}88%{transform:scaleX(1)}100%{transform:scaleX(1)}}
.railflow{stroke-dasharray:3 10;animation:rf 1.2s linear infinite}@keyframes rf{to{stroke-dashoffset:-26}}
.gloss{animation:gl 6s ease-in-out infinite}@keyframes gl{0%,40%{transform:translateX(-700px)}100%{transform:translateX(700px)}}
.rise{animation:ri 9s linear infinite}@keyframes ri{0%{transform:translateY(0);opacity:.0}15%{opacity:.8}100%{transform:translateY(-160px);opacity:0}}
.sweepT{animation:swt 6s ease-in-out infinite}@keyframes swt{0%,55%{transform:translateX(-260px) skewX(-18deg)}100%{transform:translateX(320px) skewX(-18deg)}}
.scan{animation:sc 4.5s ease-in-out infinite alternate}@keyframes sc{from{transform:translateX(0)}to{transform:translateX(380px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}.rot{animation:rt 12s linear infinite}.rot0{animation-delay:0s;opacity:1}.rot1{animation-delay:-8s;opacity:0}.rot2{animation-delay:-4s;opacity:0}@keyframes rt{0%,30%{opacity:1;transform:none}33%{opacity:0;transform:translateY(-10px)}97%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}</style><g clip-path="url(#frame)"><rect width="1200" height="440" fill="url(#bg)"/><g filter="url(#soft)" opacity=".38"><circle class="d1" cx="144" cy="66" r="198" fill="#e8b4a0"/><circle class="d2" cx="1080" cy="88" r="220" fill="#a9c8b4"/><circle class="d3" cx="600" cy="484" r="198" fill="#9fb8d6"/></g><circle class="rise" style="animation-delay:0.0s" cx="120" cy="420" r="2.5" fill="#e8b4a0"/><circle class="rise" style="animation-delay:-1.3s" cx="260" cy="400" r="2" fill="#a9c8b4"/><circle class="rise" style="animation-delay:-2.6s" cx="420" cy="430" r="3" fill="#e3cf9f"/><circle class="rise" style="animation-delay:-3.9s" cx="560" cy="410" r="2" fill="#9fb8d6"/><circle class="rise" style="animation-delay:-5.2s" cx="760" cy="425" r="2.5" fill="#d9a3ae"/><circle class="rise" style="animation-delay:-6.5s" cx="980" cy="415" r="2" fill="#a9c8b4"/><circle class="rise" style="animation-delay:-7.8s" cx="1120" cy="430" r="3" fill="#e8b4a0"/><line x1="34" y1="0" x2="34" y2="440" stroke="#27365a" stroke-width="3"/><line x1="34" y1="0" x2="34" y2="440" stroke="#e8b4a0" stroke-opacity=".8" stroke-width="2" class="railflow"/><circle class="pulse" cx="34" cy="62" r="13" fill="#e8b4a0" opacity=".35"/><circle cx="34" cy="62" r="7" fill="#0c1424" stroke="#e8b4a0" stroke-width="2.5"/><text font-size="18" fill="#f3eee6" text-anchor="middle" dominant-baseline="central">✈<animateMotion dur="7s" repeatCount="indefinite" rotate="auto" path="M34 0 V440"/></text><text x="76" y="66" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e8b4a0" letter-spacing="3.2">DEPARTURE · TUNIS</text><g transform="rotate(-4 78 112)"><text x="78" y="112" text-anchor="start" font-family="'Ink Free', 'Segoe Script', 'Bradley Hand', 'Marker Felt', 'Comic Neue', cursive" font-size="26" font-weight="400" fill="#e3cf9f" >hi, I'm</text></g><text x="72" y="192" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#f3eee6" letter-spacing="-1">Amani</text><text x="72" y="276" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#f3eee6" letter-spacing="-1">Hassani</text><text x="76" y="312" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#a9b3c7" letter-spacing="3.2">APPLIED AI · MACHINE LEARNING ENGINEERING</text><line x1="640" y1="70" x2="640" y2="370" stroke="#27365a" stroke-width="1.5"/><text x="690" y="96" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a9c8b4" letter-spacing="3.2">VISION</text><text x="690" y="140" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#f3eee6" >AI that keeps its promises</text><text x="690" y="180" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#f3eee6" >outside the notebook.</text><text x="690" y="238" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e8b4a0" letter-spacing="3.2">I BUILD</text><g class="rot rot0"><text x="690" y="274" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" fill="#e8b4a0" >models that survive unseen data.</text></g><g class="rot rot1"><text x="690" y="274" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" fill="#a9c8b4" >agents that ask a human first.</text></g><g class="rot rot2"><text x="690" y="274" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" fill="#9fb8d6" >software that ships with tests.</text></g><rect x="690" y="318" width="318" height="40" rx="20" fill="none" stroke="#a9c8b4" stroke-opacity=".7"/><circle class="pulse" cx="712" cy="338" r="6" fill="#a9c8b4"/><text x="728" y="344" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f3eee6" >Open to a 6-month PFE · 2027</text><text x="76" y="350" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#a9b3c7" >I spent two years teaching virtualisation labs at ESPRIT.</text><text x="76" y="376" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#a9b3c7" >Now, in my final year, I build AI that has to work</text><text x="76" y="402" text-anchor="start" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#a9b3c7" >on data it has never seen.</text></g><rect x=".75" y=".75" width="1198.5" height="438.5" rx="23.25" fill="none" stroke="#27365a" stroke-width="1.5"/></svg>